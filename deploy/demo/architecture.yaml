apiVersion: v1
kind: Namespace
metadata:
  name: constack-demo
  labels:
    app.kubernetes.io/part-of: constack-demo
    constack.io/demo: 'true'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-runtime
  namespace: constack-demo
  labels:
    app.kubernetes.io/part-of: constack-demo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: constack-demo
data:
  ORDERS_DATABASE_HOST: orders-db
  SESSION_CACHE_HOST: session-cache
  PAYMENT_API_URL: http://payments.constack-demo.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-database-credentials
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/part-of: constack-demo
type: Opaque
stringData:
  username: demo_user
  password: demo-only-not-for-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: constack-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: constack-demo
    spec:
      serviceAccountName: demo-runtime
      automountServiceAccountToken: false
      containers:
        - name: storefront
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: constack-demo
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: constack-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: constack-demo
    spec:
      serviceAccountName: demo-runtime
      automountServiceAccountToken: false
      containers:
        - name: checkout-api
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: checkout-config
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: demo-database-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-database-credentials
                  key: password
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: constack-demo
spec:
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: constack-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-api
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: constack-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: constack-demo
    spec:
      serviceAccountName: demo-runtime
      automountServiceAccountToken: false
      containers:
        - name: payments
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: constack-demo
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-worker
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: events-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: constack-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: constack-demo
    spec:
      serviceAccountName: demo-runtime
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'while true; do echo processing-order-events; sleep 30; done']
          envFrom:
            - configMapRef:
                name: checkout-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: constack-demo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: orders-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: constack-demo
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: constack-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: demo-database-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-database-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'demo_user', '-d', 'orders']
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: orders-db
          app.kubernetes.io/part-of: constack-demo
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: session-cache
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: session-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: constack-demo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: session-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: session-cache
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: session-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: constack-demo
spec:
  serviceName: session-cache
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: session-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-cache
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: constack-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          args: ['redis-server', '--appendonly', 'yes']
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 3
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: session-cache
          app.kubernetes.io/part-of: constack-demo
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: order-reconciliation
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: order-reconciliation
    app.kubernetes.io/component: scheduled-job
    app.kubernetes.io/part-of: constack-demo
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: order-reconciliation
            app.kubernetes.io/part-of: constack-demo
        spec:
          serviceAccountName: demo-runtime
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: reconcile
              image: busybox:1.37
              imagePullPolicy: IfNotPresent
              command: ['sh', '-c', 'echo reconciling-orders; sleep 5']
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-store
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: demo-store
    app.kubernetes.io/part-of: constack-demo
spec:
  rules:
    - host: demo.constack.local
      http:
        paths:
          - path: /api/checkout
            pathType: Prefix
            backend:
              service:
                name: checkout-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-ingress
  namespace: constack-demo
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: constack-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: storefront
      ports:
        - protocol: TCP
          port: 80
