apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "constack.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "constack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "constack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      {{- include "constack.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.images.services.repository }}:{{ .Values.images.services.tag }}"
          command: ["node", "apps/api/dist/persistence/run-migrations.js"]
          envFrom:
            - configMapRef: { name: {{ include "constack.fullname" . }}-runtime }
            - secretRef: { name: {{ include "constack.secretName" . }} }
          securityContext: {{- include "constack.securityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
