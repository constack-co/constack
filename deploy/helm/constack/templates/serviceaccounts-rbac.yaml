apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constack.fullname" . }}-api
  labels: {{- include "constack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constack.fullname" . }}-discovery
  labels: {{- include "constack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constack.fullname" . }}-web
  labels: {{- include "constack.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constack.fullname" . }}-gateway
  labels: {{- include "constack.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constack.fullname" . }}-read
  labels: {{- include "constack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "pods/log", "services", "endpoints", "persistentvolumes", "persistentvolumeclaims", "configmaps", "serviceaccounts", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constack.fullname" . }}-discovery-read
  labels: {{- include "constack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "constack.fullname" . }}-read }
subjects:
  - { kind: ServiceAccount, name: {{ include "constack.fullname" . }}-discovery, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constack.fullname" . }}-api-read
  labels: {{- include "constack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "constack.fullname" . }}-read }
subjects:
  - { kind: ServiceAccount, name: {{ include "constack.fullname" . }}-api, namespace: {{ .Release.Namespace }} }
{{- if .Values.discovery.secretMetadata.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constack.fullname" . }}-secret-metadata-read
  labels: {{- include "constack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constack.fullname" . }}-discovery-secret-metadata-read
  labels: {{- include "constack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "constack.fullname" . }}-secret-metadata-read }
subjects:
  - { kind: ServiceAccount, name: {{ include "constack.fullname" . }}-discovery, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- if .Values.actions.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constack.fullname" . }}-action-reviewer
  labels: {{- include "constack.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constack.fullname" . }}-action-reviewer
  labels: {{- include "constack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "constack.fullname" . }}-action-reviewer }
subjects:
  - { kind: ServiceAccount, name: {{ include "constack.fullname" . }}-api, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "constack.fullname" . }}-actions
  labels: {{- include "constack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "constack.fullname" . }}-actions
  labels: {{- include "constack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "constack.fullname" . }}-actions
  labels: {{- include "constack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "constack.fullname" . }}-actions }
subjects:
  - { kind: ServiceAccount, name: {{ include "constack.fullname" . }}-actions, namespace: {{ .Release.Namespace }} }
{{- end }}
