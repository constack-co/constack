apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "constack.fullname" . }}-gateway
  labels: {{- include "constack.labels" . | nindent 4 }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $constack_forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
    upstream constack_web { server {{ include "constack.fullname" . }}-web:3000; }
    upstream constack_api { server {{ include "constack.fullname" . }}-api:3001; }
    server {
      listen 8080;
      server_tokens off;
      client_max_body_size 1m;
      location /api/ {
        proxy_pass http://constack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $constack_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /socket.io/ {
        proxy_pass http://constack_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $constack_forwarded_proto;
      }
      location / {
        proxy_pass http://constack_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $constack_forwarded_proto;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constack.fullname" . }}-gateway
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "constack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "constack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- include "constack.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "constack.fullname" . }}-gateway
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources.gateway | nindent 12 }}
          readinessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: {{ include "constack.fullname" . }}-gateway } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constack.fullname" . }}
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "constack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
