apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constack.fullname" . }}-web
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "constack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "constack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "constack.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "constack.fullname" . }}-web
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          securityContext: {{- include "constack.securityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          readinessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constack.fullname" . }}-web
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "constack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "constack.fullname" . }}-api
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "constack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "constack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "constack.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "constack.fullname" . }}-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.images.services.repository }}:{{ .Values.images.services.tag }}"
          imagePullPolicy: {{ .Values.images.services.pullPolicy }}
          command: ["node", "apps/api/dist/main.js"]
          envFrom:
            - configMapRef: { name: {{ include "constack.fullname" . }}-runtime }
            - secretRef: { name: {{ include "constack.secretName" . }} }
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          {{- if and .Values.oidc.enabled .Values.oidc.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.existingSecret }}, key: {{ .Values.oidc.clientSecretKey }} } }
          {{- end }}
          ports: [{ name: http, containerPort: 3001 }]
          securityContext: {{- include "constack.securityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: http }, initialDelaySeconds: 8, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constack.fullname" . }}-api
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "constack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: apps/v1
