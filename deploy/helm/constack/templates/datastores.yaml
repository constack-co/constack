{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constack.fullname" . }}-mysql
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "constack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
  ports: [{ name: mysql, port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "constack.fullname" . }}-mysql
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "constack.fullname" . }}-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "constack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        {{- include "constack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      {{- include "constack.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: constack }
            - { name: MYSQL_USER, value: constack }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "constack.secretName" . }}, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "constack.secretName" . }}, key: MYSQL_ROOT_PASSWORD } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, capabilities: { drop: ["ALL"] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          readinessProbe: { exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uconstack -p$MYSQL_PASSWORD"] }, initialDelaySeconds: 15, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.mysql.storage }} } }
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "constack.fullname" . }}-redis
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "constack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "constack.fullname" . }}-redis
  labels: {{- include "constack.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "constack.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "constack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "constack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- include "constack.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: ["redis-server", "--appendonly", "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 5, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
{{- end }}
