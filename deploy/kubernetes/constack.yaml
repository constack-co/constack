apiVersion: apps/v1
kind: Deployment
metadata:
  name: constack-gateway
  labels:
    app.kubernetes.io/name: constack
    app.kubernetes.io/instance: constack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "constack-0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: constack
      app.kubernetes.io/instance: constack
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: constack
        app.kubernetes.io/instance: constack
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: constack-gateway
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: "nginx:1.29-alpine"
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities: { drop: ["ALL"] }
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          readinessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: constack-gateway } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
