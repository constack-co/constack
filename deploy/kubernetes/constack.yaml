# Source: constack/templates/gateway.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: constack-gateway
  labels:
    app.kubernetes.io/name: constack
    app.kubernetes.io/instance: constack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "constack-0.1.0"
data:
  default.conf: |
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream constack_web { server constack-web:3000; }
    upstream constack_api { server constack-api:3001; }
    server {
      listen 8080;
      server_tokens off;
      client_max_body_size 1m;
      location /api/ {
        proxy_pass http://constack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /socket.io/ {
        proxy_pass http://constack_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
      }
      location / {
        proxy_pass http://constack_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
