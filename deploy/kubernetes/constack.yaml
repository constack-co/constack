# Source: constack/templates/datastores.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: constack-mysql
  labels:
    app.kubernetes.io/name: constack
    app.kubernetes.io/instance: constack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "constack-0.1.0"
spec:
  serviceName: constack-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: constack
      app.kubernetes.io/instance: constack
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: constack
        app.kubernetes.io/instance: constack
        app.kubernetes.io/component: mysql
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mysql
          image: "mysql:8.4"
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: constack }
            - { name: MYSQL_USER, value: constack }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: constack-runtime, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: constack-runtime, key: MYSQL_ROOT_PASSWORD } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, capabilities: { drop: ["ALL"] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          readinessProbe: { exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uconstack -p$MYSQL_PASSWORD"] }, initialDelaySeconds: 15, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
