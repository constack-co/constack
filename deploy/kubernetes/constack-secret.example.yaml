apiVersion: v1
kind: Secret
metadata:
  name: constack-runtime
  namespace: constack
type: Opaque
stringData:
  MYSQL_PASSWORD: CHANGE_ME_DATABASE_PASSWORD
  MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT_DATABASE_PASSWORD
  DATABASE_URL: mysql://constack:CHANGE_ME_DATABASE_PASSWORD@constack-mysql:3306/constack
  REDIS_URL: redis://constack-redis:6379
  SESSION_SECRET: CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS
  BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME_STRONG_BOOTSTRAP_PASSWORD
