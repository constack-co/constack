map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $constack_forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
upstream constack_web { server web:3000; }
upstream constack_api { server api:3001; }
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 1m;
  location /api/ {
    proxy_pass http://constack_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $constack_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /socket.io/ {
    proxy_pass http://constack_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $constack_forwarded_proto;
  }
  location / {
    proxy_pass http://constack_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $constack_forwarded_proto;
  }
}
