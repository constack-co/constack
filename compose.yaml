services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: constack
      MYSQL_USER: constack
      MYSQL_PASSWORD: constack
      MYSQL_ROOT_PASSWORD: constack-root
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      {
        test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uconstack', '-pconstack'],
        interval: 5s,
        timeout: 3s,
        retries: 30,
      }
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
  migrate:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.services }
    command: ['node', 'apps/api/dist/persistence/run-migrations.js']
    environment: &service-env
      NODE_ENV: production
      DATABASE_URL: mysql://constack:constack@mysql:3306/constack
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: local-compose-session-secret-change-this-value
      BOOTSTRAP_ADMIN_EMAIL: admin@constack.local
      BOOTSTRAP_ADMIN_PASSWORD: constack-development-admin
      DEMO_MODE: 'true'
      ACTIONS_ENABLED: 'false'
      AI_ENABLED: 'false'
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.services }
    command: ['node', 'apps/api/dist/main.js']
    environment: *service-env
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.web }
    environment: { HOSTNAME: '0.0.0.0', PORT: '3000' }
  gateway:
    image: nginx:1.29-alpine
    ports: ['8080:8080']
    volumes: ['./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api, web]
volumes:
  mysql-data:
  redis-data:
